# Bloque principal del servidor virtual HTTP
server {
    # Escucha peticiones HTTP en el puerto 80 del contenedor
    listen 80;
    # Acepta cualquier nombre de dominio o IP
    server_name _;
    # Directorio raiz donde estan los ficheros de WordPress (volumen wp_data)
    root /var/www/html;
    # Fichero por defecto al acceder a un directorio
    index index.php;
    # Tamano maximo permitido para subida de archivos (imagenes, plugins, etc.)
    client_max_body_size 64M;

    # Gestion de peticiones generales y enlaces permanentes de WordPress
    location / {
        # Intenta servir el archivo, luego directorio, y si no existe redirige a index.php
        try_files $uri $uri/ /index.php?$args;
    }

    # Procesamiento de ficheros PHP mediante FastCGI
    location ~ \.php$ {
        # Incluye los parametros estandar de FastCGI
        include fastcgi_params;
        # Envia la ejecucion PHP al contenedor 'wordpress' en el puerto 9000 (PHP-FPM)
        fastcgi_pass wordpress:9000;
        # Indica a PHP-FPM la ruta exacta del script a ejecutar
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
